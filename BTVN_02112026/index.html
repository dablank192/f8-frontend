<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="navbar">
        <div class="left-nav">
            <p>Home</p>
            <p>Pages</p>
            <p>Articles</p>
        </div>
        <a href="" id="logo">
            <img src="images/logo.png" alt="">
        </a>
        <div class="right-nav">
            <p>Contact</p>
            <p>Shop</p>
            <p>Locations</p>

        </div>
    </div>


    <div class="content">
        <a href="" id="cf1">
            <img src="images/cf1.jpg" alt="cf1">
        </a>

        <div class="intro">
            <p>Because we love coffee</p>
            <h3>About us</h3>
        </div>

        <div class="about">
            <a href="">
                <img src="images/cf3.jpg" alt="cf3">
            </a>
            <div class="mission">
                <p>Our mission</p>
                <h3>It all began with a modest concept: Create amazing coffee</h3>
            </div>
            <a href="">
                <img src="images/cf2.jpg" alt="cf2">
            </a>
        </div>

        <div class="about-2">
            <div class="home">
                <p>Home delivery</p>
                <h3>Quality coffee delivered to your door</h3>
            </div>

            <a href="">
                <img src="images/cf4.jpg" alt="cf4">
            </a>

            <div class="home">
                <p>Time to chill</p>
                <h3>Black coffee shaved ice</h3>
            </div>
        </div>

        <a href="" id="cf5">
            <img src="images/cf5.jpg" alt="cf5">
        </a>
    </div>


    <div class="footer">
        <a href="" class="footer-logo">
            <img src="images/logo.png" alt="Amaya Roasting Co.">
        </a>
        <form class="footer-contact">
            <input type="email" name="email" placeholder="Enter email address..." aria-label="Email address" required>
            <button type="submit">Contact Us</button>
        </form>
    </div>
</body>

</html>
