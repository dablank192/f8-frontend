<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="0">
        <thead>
            <tr>
                <th colspan="4">Novell Services Login</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Username:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td>
                    <label for="">
                    <input type="password">
                </label>
            </td>
            </tr>
            <tr>
                <td>City of Employment</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Web server:</td>
                <td>
                    <select name="server">
                        <option value="server1">Server 1</option>
                        <option value="server2">Server 2</option>
                        <option value="server3">Server 3</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Please specify your role:</td>
                <td>
                    <label for="">
                        <input type="radio" name="Admin" id="">
                        Admin
                    </label>
                    <br>
                    <label for="">
                        <input type="radio" name="Engineer" id="">
                        Engineer
                    </label>
                    <br>
                    <label for="">
                        <input type="radio" name="Manager" id="">
                        Manager
                    </label>
                    <br>
                    <label for="">
                        <input type="radio" name="Guest" id="">
                        Guest
                    </label>
                </td>
            </tr>
            <tr>
                <td>Single Sign-on to the following:</td>
                <td>
                    <label for="">
                        <input type="checkbox" name="Mail" id="">
                        Mail
                    </label>
                    <br>
                    <label for="">
                        <input type="checkbox" name="Payroll" id="">
                        Payroll
                    </label>
                    <br>
                    <label for="">
                        <input type="checkbox" name="Service" id="">
                        Service
                    </label>
                </td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2" align="center">
                    <button type="button">Login</button>
                    <button type="button">Reset</button>
                </td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
